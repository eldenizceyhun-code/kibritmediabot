name: Run Kibrit Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
        run: |
          python bot.py

      - name: Commit and push if state changed
        run: |
          git config --global user.name "Kibrit Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add sent_ids.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sent post IDs [skip ci]" && git push)
